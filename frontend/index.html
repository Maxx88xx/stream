<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pons.live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%23d4fc50%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27Inter,Arial,sans-serif%27 font-size=%2738%27 font-weight=%27500%27 text-anchor=%27middle%27 fill=%27%23111%27%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/pons.css">
<script src="/assets/hls.min.js"></script>
<script src="/assets/livekit-client.umd.js"></script>
<style>
  /* ---- pons.css carries PONS's own rules; below: page chrome + the stream/chat bits PONS doesn't have ---- */
  html { background:var(--bg-page); color-scheme:dark; }
  body { margin:0; background:var(--bg-page); color:var(--text-primary); font-family:var(--font-sans); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; }
  img { max-width:100%; }
  .site-nav { position:sticky; top:0; z-index:40; height:76px; }
  .site-nav .nav-glass { -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%); }
  .nav-inner { max-width:1080px; }
  .nav-product-links { gap:2px; }
  .nav-product-link { font-size:14px; display:inline-flex; align-items:center; gap:8px; }
  .nav-product-link.is-active { background:var(--bg-white); box-shadow:0 1px 3px #11111114; }
  .nav-product-link .live-dot { width:7px; height:7px; border-radius:50%; background:var(--accent-red); box-shadow:0 0 8px var(--accent-red); }
  .nav-connect { min-height:40px; padding:9px 16px; font-size:15px; font-weight:500; border:0; cursor:pointer; }
  .nav-theme { cursor:pointer; display:inline-grid; place-items:center; }
  .nav-logo-mark { width:40px; height:40px; border-radius:12px; background:var(--accent); color:#111; display:grid; place-items:center; font-size:22px; font-weight:500; }
  main.bridge-shell { padding:22px 24px 60px; box-sizing:border-box; }
  .launchpad-explore-shell { max-width:1080px; }
  .launch-explore-search { font-size:16px; }
  .launch-explore-search input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text-primary); font:inherit; font-size:16px; }
  .launch-explore-search input::placeholder { color:var(--text-muted); }
  .launch-explore-search svg { flex:none; width:18px; height:18px; }
  .launch-explore-grid { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(196px, 1fr)); gap:14px; }
  .launch-explore-grid > li { min-width:0; }
  .launchpad-explore-shell { display:grid; gap:16px; }
  .launch-card { display:grid; padding:10px; box-shadow:none; }
  .launch-card-live-badge { -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#111; background:var(--accent); border-radius:999px; padding:4px 8px; font-size:10px; line-height:1.2; display:inline-flex; align-items:center; gap:5px; }
  .launch-card-live-badge::before { content:""; width:6px; height:6px; border-radius:50%; background:#111; animation:live-blink 1.2s infinite; }
  @keyframes live-blink { 50% { opacity:.25; } }
  .launch-card-viewers { -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#fff; background:#111111b8; border-radius:999px; padding:4px 8px; font-size:10px; line-height:1.2; }
  .launch-card.is-new { animation:card-pop 1.2s var(--ease-out); }
  html[data-theme=dark] .launch-explore-grid .launch-card:hover, .launch-explore-grid .launch-card:hover { box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent) !important; transform:none !important; background:color-mix(in srgb, var(--accent) 18%, var(--panel-blue)) !important; }
  .launch-card-logo .ph { font-size:26px; color:var(--text-subtle); }
  .launch-explore-empty-copy { color:var(--text-muted); font-size:13px; padding:8px 2px 4px; }

  /* token page */
  .token-buy-shell { max-width:1080px; }
  .token-about-card .token-about-meta { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 28px; align-items:end; }
  .v2-about-body > p:first-child { color:var(--text-primary); font-size:14px; line-height:1.55; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .token-buy-layout { grid-template-columns:minmax(460px,1fr) minmax(300px,340px); }
  .token-buy-card { display:flex; flex-direction:column; gap:16px; padding:22px 20px 20px; align-self:start; position:sticky; top:92px; height:calc(100vh - 110px); max-height:820px; }
  .token-buy-header h1 { margin:0; }
  .token-buy-header p { margin:0; display:flex; align-items:center; gap:8px; }
  .token-buy-logo { border-radius:14px; overflow:hidden; display:block; border:0; padding:0; }
  .chat-wrap { flex:1; min-height:240px; display:flex; flex-direction:column; background:var(--chart-stage); border-radius:18px; padding:12px; }
  .chat-head { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-muted); padding:2px 4px 8px; }
  .chat-head span { background:var(--panel-blue); border-radius:999px; padding:2px 8px; font-variant-numeric:tabular-nums; }
  .chat-msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:2px 4px; min-height:0; }
  .chat-msg { font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
  .chat-msg b { font-weight:400; color:var(--chart-line); cursor:pointer; }
  .chat-msg.is-sys { color:var(--text-subtle); }
  .chat-form { display:flex; gap:8px; margin-top:10px; }
  .chat-form input { flex:1; min-width:0; background:var(--bg-white); border:1px solid var(--divider); border-radius:999px; padding:10px 14px; color:var(--text-primary); font:inherit; font-size:14px; outline:0; }
  .chat-form input::placeholder { color:var(--text-subtle); }
  .chat-form button { background:var(--panel-blue); border:0; border-radius:999px; padding:0 14px; cursor:pointer; font-size:13px; }
  .token-buy-card > .ui-btn { min-height:52px; border-radius:20px; border:0; cursor:pointer; font-size:17px; font-weight:500; }
  .token-market-card { min-height:0; }
  .stream-stage { position:relative; background:#000; border-radius:18px; overflow:hidden; aspect-ratio:16/9; }
  .stream-stage iframe, .stream-stage video { width:100%; height:100%; border:0; display:block; }
  .stream-off { position:absolute; inset:0; display:grid; place-items:center; align-content:center; gap:10px; color:var(--text-muted); background:var(--chart-stage); font-size:13px; }
  .stream-off img { width:88px; height:88px; border-radius:18px; object-fit:cover; }
  .stream-live { position:absolute; top:12px; left:12px; display:flex; gap:6px; z-index:2; }
  .stream-connecting { position:absolute; inset:0; display:grid; place-items:center; color:var(--text-muted); font-size:13px; background:#000; pointer-events:none; }
  .stream-stage video { background:#000; }
  .token-market-chart .noxa-chart-stage { min-height:300px; }
  .noxa-chart-range { font-size:11px; }
  .token-trades-row { grid-template-columns:22px minmax(0,1fr) auto 3.5ch; }
  .token-trades-venue { color:var(--text-muted); font-size:11px; }
  .token-trades-time { justify-self:end; }
  .token-activity-count { border-radius:999px; height:26px; display:inline-grid; place-items:center; padding:0 8px; font-size:12px; }
  .tabs-pill .tabs-list { background:var(--panel-blue); }
  .tabs-tab { background:none; border:0; cursor:pointer; padding:8px 14px; font-size:13px; border-radius:12px; min-width:0; }
  .tabs-tab.is-active { background:var(--bg-white); box-shadow:0 1px 3px #11111114; }

  /* stream page layout: player 66% + chat 27% (pump.fun proportions), chat as tall as the player */
  .token-buy-shell { max-width:1320px; }
  .stream-layout { grid-template-columns:minmax(0,3fr) minmax(300px,1fr); gap:20px; align-items:start; }
  .stream-card { padding:14px; background:var(--bg-white); border:1px solid var(--float-border); border-radius:28px; }
  .stream-col { display:grid; gap:16px; min-width:0; }
  .stream-col .stream-stage { border-radius:16px; }
  .chat-card { display:flex; flex-direction:column; padding:18px 20px 20px; aspect-ratio:auto; height:100%; box-sizing:border-box; background:var(--bg-white); }
  .stream-layout .chat-card { align-self:start; position:sticky; top:92px; height:calc(100vh - 110px); max-height:900px; }
  .chat-card .chat-head { display:flex; align-items:center; justify-content:space-between; padding:0 0 12px; }
  .chat-card .chat-head h3 { margin:0; font-size:20px; font-weight:500; }
  .chat-card .chat-head span { background:var(--panel-blue); border-radius:999px; padding:3px 10px; font-size:13px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .chat-card .chat-msgs { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px; }
  .chat-card .chat-msg { font-size:15px; line-height:1.45; }
  .chat-card .chat-msg.is-sys { text-align:center; margin:auto 0; color:var(--text-subtle); font-size:15px; }
  .chat-card .chat-form { display:flex; gap:10px; margin-top:14px; }
  .chat-card .chat-form input { height:50px; border-radius:14px; padding:0 16px; font-size:15px; background:var(--panel-blue); border:1px solid var(--divider); }
  .chat-card .chat-form button { width:50px; height:50px; flex:none; border-radius:50%; background:var(--accent); color:#111; border:0; display:grid; place-items:center; padding:0; cursor:pointer; }
  .stream-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:2px 6px; min-width:0; }
  .stream-meta-left { display:flex; align-items:center; gap:12px; min-width:0; flex:1; }
  .launch-card-live-badge.is-big { font-size:13px; padding:5px 10px; }
  .stream-title { margin:0; font-size:22px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stream-started { color:var(--text-muted); font-size:15px; white-space:nowrap; }
  .stream-meta-right { display:flex; align-items:center; gap:12px; flex:none; }
  .stream-coin { display:flex; align-items:center; gap:10px; }
  .stream-coin img, .stream-coin-ph { width:40px; height:40px; border-radius:11px; object-fit:cover; background:var(--panel-blue); display:grid; place-items:center; font-size:11px; color:var(--text-subtle); }
  .stream-coin > span { display:grid; gap:2px; }
  .stream-coin b { font-weight:400; font-size:15px; white-space:nowrap; }
  .stream-coin small { color:var(--text-muted); font-size:12px; display:inline-flex; align-items:center; gap:6px; }
  .stream-action.ui-btn { width:auto; min-height:44px; padding:0 18px; border-radius:999px; border:0; font-size:15px; font-weight:500; cursor:pointer; }
  .stream-stage .sc-btn { width:46px; height:44px; }
  .stream-stage .sc-stop { width:44px; height:44px; }
  .stream-stage .sc-vol { width:100px; }
  .stream-live .launch-card-live-badge { font-size:13px; padding:5px 10px; }
  .stream-live .launch-card-viewers { font-size:13px; padding:5px 10px; }
  @media (max-width:900px) { .stream-layout { grid-template-columns:1fr; } .stream-layout .chat-card { position:static; height:60vh; } .stream-meta { flex-wrap:wrap; } }
  /* landing + legal + footer */
  .land-hero { padding:34px 32px 32px; }
  .land-kicker { display:inline-block; background:var(--lime-soft, #1c2610); color:var(--accent); border-radius:999px; padding:5px 12px; font-size:12px; margin-bottom:16px; }
  .land-hero h1 { margin:0 0 12px; font-size:44px; line-height:1.05; font-weight:500; letter-spacing:-.02em; }
  .land-lead { color:var(--text-muted); font-size:17px; line-height:1.55; max-width:62ch; margin:0 0 24px; }
  .land-cta { display:flex; gap:10px; flex-wrap:wrap; }
  .land-btn.ui-btn { width:auto; min-height:50px; padding:0 22px; border-radius:999px; border:0; cursor:pointer; font-size:16px; font-weight:500; text-decoration:none; display:inline-flex; align-items:center; }
  .land-btn-ghost { background:var(--panel-blue); color:var(--text-primary); }
  .land-feats { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
  .land-feat { background:var(--panel-blue); border-radius:20px; padding:18px 20px; }
  .land-feat h3 { margin:0 0 6px; font-size:17px; font-weight:500; }
  .land-feat p { margin:0; color:var(--text-muted); font-size:14px; line-height:1.55; }
  .land-trust h2 { margin-bottom:10px; }
  .legal h1 { margin:0 0 4px; font-size:28px; font-weight:500; }
  .legal-date { color:var(--text-subtle); font-size:13px; margin:0 0 18px; }
  .legal-intro { color:var(--text-primary); font-size:15px; line-height:1.6; background:var(--panel-blue); border-radius:16px; padding:14px 16px; margin:0 0 20px; }
  .legal-sec { margin:0 0 20px; }
  .legal-sec h2 { margin:0 0 6px; font-size:13px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
  .legal-sec p { margin:0 0 8px; font-size:15px; line-height:1.6; color:var(--text-primary); max-width:80ch; }
  .site-foot { max-width:1080px; margin:0 auto; padding:10px 24px 40px; color:var(--text-subtle); font-size:13px; }
  .site-foot-links { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:8px; }
  .site-foot-links a { color:var(--text-muted); }
  .site-foot-links a:hover { color:var(--text-primary); }
  .site-foot p { margin:0; }
  @media (max-width:720px) { .land-feats { grid-template-columns:1fr; } .land-hero h1 { font-size:32px; } }
  /* about page */
  .about-hero h1 { margin:0 0 10px; font-size:30px; font-weight:400; }
  .about-lead { color:var(--text-muted); font-size:15px; line-height:1.6; max-width:70ch; margin:0 0 22px; }
  .about-steps { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; }
  .about-step { background:var(--panel-blue); border-radius:20px; padding:18px 18px 20px; }
  .about-num { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:999px; background:var(--accent); color:#111; font-size:14px; font-weight:500; margin-bottom:12px; }
  .about-step h3 { margin:0 0 6px; font-size:17px; font-weight:500; }
  .about-step p { margin:0; color:var(--text-muted); font-size:14px; line-height:1.5; }
  .about-card h2 { margin:0 0 6px; font-size:20px; font-weight:400; }
  .about-list { margin:0; padding-left:18px; color:var(--text-muted); font-size:14px; line-height:1.6; display:grid; gap:6px; }
  .about-list li::marker { color:var(--accent); }
  @media (max-width:720px) { .about-steps { grid-template-columns:1fr; } }
  /* chat moderation, holders-only, search suggestions */
  .chat-role { display:inline-block; margin-left:6px; font-size:9px; letter-spacing:.06em; border-radius:999px; padding:2px 6px; vertical-align:middle; }
  .chat-role.is-dev { background:var(--accent); color:#111; }
  .chat-role.is-mod { background:#2563ebd9; color:#fff; }
  .chat-msg { display:flex; align-items:flex-start; gap:6px; }
  .chat-body { flex:1; min-width:0; }
  .chat-dots { display:none; flex:none; background:none; border:0; color:var(--text-muted); font-size:16px; line-height:1; padding:0 4px; border-radius:6px; cursor:pointer; }
  .chat-msg.can-mod:hover .chat-dots, .chat-msg.can-mod .chat-dots:focus { display:inline-block; }
  .chat-dots:hover { background:var(--panel-blue); color:var(--text-primary); }
  .chat-menu button svg { width:16px; height:16px; margin-right:8px; vertical-align:-3px; }
  .trade-btn.pbtn, .token-info-links a.trade-btn { background:var(--accent) !important; color:#111 !important; font-size:14px !important; padding:11px 18px !important; font-weight:500; }
  .load-more-row { display:flex; justify-content:center; padding-top:6px; }
  .load-more { margin:0 !important; }
  .chat-menu { position:absolute; right:0; top:100%; margin-top:4px; background:#1c1c1c; border:1px solid var(--divider); border-radius:12px; padding:6px; display:grid; gap:2px; min-width:180px; z-index:6; box-shadow:0 12px 30px #00000066; }
  .chat-menu-who { font-size:11px; color:var(--text-subtle); padding:4px 8px 6px; }
  .chat-menu button { background:none; border:0; color:var(--text-primary); text-align:left; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
  .chat-menu button:hover { background:var(--panel-blue); }
  .chat-menu button.is-danger { color:var(--accent-red); }
  .chat-msg { position:relative; }
  .chat-head-right { display:flex; align-items:center; gap:8px; }
  .chat-lock { background:var(--panel-blue); border:0; color:var(--text-muted); width:30px; height:26px; border-radius:999px; display:grid; place-items:center; padding:0; }
  .chat-lock svg { width:14px; height:14px; }
  .chat-lock.is-on { background:var(--accent); color:#111; }
  .chat-card .chat-form input:disabled { opacity:.6; }
  .toggle-row { display:flex; align-items:center; gap:12px; margin:12px 0 4px; cursor:pointer; font-size:15px; }
  .toggle-row input { display:none; }
  .toggle-row small { display:block; color:var(--text-muted); font-size:12px; }
  .toggle-ui { width:44px; height:26px; border-radius:999px; background:var(--panel-blue); position:relative; flex:none; transition:background .15s; }
  .toggle-ui::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s; }
  .toggle-row input:checked + .toggle-ui { background:var(--accent); }
  .toggle-row input:checked + .toggle-ui::after { transform:translateX(18px); background:#111; }
  .search-wrap { position:relative; }
  .search-drop { position:absolute; left:0; right:0; top:calc(100% + 8px); background:var(--bg-white); border:1px solid var(--float-border); border-radius:20px; padding:8px; box-shadow:var(--float-shadow); z-index:30; max-height:420px; overflow:auto; }
  .search-title { display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-subtle); padding:6px 10px 4px; }
  .search-title button { background:none; border:0; color:var(--text-muted); font-size:11px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .search-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; cursor:pointer; color:var(--text-primary); font-size:14px; }
  .search-row:hover, .search-row.is-sel { background:var(--panel-blue); }
  .search-row img, .search-ph { width:30px; height:30px; border-radius:8px; object-fit:cover; background:var(--panel-blue); display:grid; place-items:center; font-size:10px; color:var(--text-subtle); flex:none; }
  .search-row.is-query svg { width:18px; height:18px; color:var(--text-muted); margin:0 6px; }
  .search-name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-name small { color:var(--text-muted); margin-left:6px; }
  .search-mc { color:var(--text-muted); font-size:13px; font-variant-numeric:tabular-nums; }
  button:active, .pbtn:active, .ui-btn:active:not(:disabled), .launch-card:active, .nav-product-link:active, .nav-connect:active, .launch-explore-create-btn:active, .token-info-links a:active, .land-btn:active, .search-row:active, .noxa-chart-range:active, .sc-btn:active { transform:scale(.97) !important; transition:transform .05s !important; }
  .launch-card.is-skeleton { pointer-events:none; }
  .launch-card.is-skeleton .launch-card-logo { background:linear-gradient(90deg, #0d0d0d 25%, #1a1a1a 50%, #0d0d0d 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  .launch-card.is-skeleton strong, .launch-card.is-skeleton small { background:#1a1a1a; border-radius:6px; display:block; height:12px; width:60%; }
  @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
  /* liquid-glass treatment for every lime element */
  .nav-connect, .ui-btn-primary, .pbtn.primary, .trade-btn.pbtn, .token-info-links a.trade-btn, .launch-card-live-badge, .stream-action.ui-btn, .chat-card .chat-form button, .chat-lock.is-on, .about-num, .nav-logo-mark, .land-btn.ui-btn-primary, .cred-copy.is-lime {
    background:linear-gradient(180deg, rgba(222,255,110,.95) 0%, rgba(212,252,80,.86) 55%, rgba(190,236,52,.88) 100%) !important;
    color:#111 !important;
    border:1px solid rgba(255,255,255,.42) !important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.14), 0 6px 20px rgba(212,252,80,.16) !important;
    -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
    position:relative; overflow:hidden; isolation:isolate;
  }
  .nav-connect::after, .ui-btn-primary::after, .pbtn.primary::after, .trade-btn::after, .launch-card-live-badge::after, .stream-action.ui-btn::after, .chat-card .chat-form button::after, .chat-lock.is-on::after, .about-num::after, .nav-logo-mark::after {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0;
    background:linear-gradient(to bottom, rgba(255,255,255,.38) 0%, rgba(255,255,255,.08) 42%, transparent 60%);

    wsRoom = c.address; wsSend({ t: 'sub', room: c.address });
    const hHist = (m) => { msgs.innerHTML = ''; m.rows.forEach(r => addMsg(r)); if (!m.rows.length) addMsg({ text: 'New messages will appear here' }, true); };
    const hChat = (m) => addMsg(m);
    const hViewers = (m) => { if (m.token !== c.address) return; c.viewers = m.n; chatCount.textContent = m.n; const v = $('#viewers'); if (v) v.textContent = m.n + ' watching'; };
    const hLive = async (m) => { if (m.token !== c.address) return; try { c = { ...c, ...(await api('/api/token/' + addr)) }; } catch {} paintPlayer(); metaLeft.innerHTML = ''; metaLeft.append(c.live ? el('span', { class: 'launch-card-live-badge is-big' }, 'LIVE') : null, el('h2', { class: 'stream-title' }, c.title || c.name), startedEl); startedEl.textContent = c.started_ts && c.live ? 'Started ' + ago(Date.now() / 1000 - c.started_ts) : ''; actionBtn && (actionBtn.firstChild.textContent = c.live ? 'Stream settings' : 'Go live'); };
    const hBan = (m) => { msgs.querySelectorAll('.chat-msg[data-wallet="' + m.wallet + '"]').forEach(n => n.remove()); addMsg({ text: (m.who || short(m.wallet)) + ' was banned' }, true); };
    const hUnban = (m) => addMsg({ text: (m.who || short(m.wallet)) + ' was unbanned' }, true);
    const hRoom = (m) => { if (m.token !== c.address) return; roomState = m; paintRoom(); };
    const hNotice = (m) => addMsg({ text: m.text }, true);
    on('history', hHist); on('chat', hChat); on('viewers', hViewers); on('live', hLive); on('banned', hBan); on('unbanned', hUnban); on('room', hRoom); on('notice', hNotice);
    paintRoom();
    // chart + trades
    let range = '1H', timer, lastKey = '';
    const paintChart = async (force) => {
      const [, tf, limit] = RANGES.find(r => r[0] === range);
      const path = `/api/candles/${c.address}?tf=${tf}&limit=${limit}`;
      const d = force ? (await swr(path, () => {})) : await apiRaw(path).then(x => { cacheSet(path, x); return x; });
      const key = range + ':' + d.candles.length + ':' + (d.candles.length ? d.candles[d.candles.length - 1].time + ':' + d.candles[d.candles.length - 1].close : '') + ':' + (d.trades[0] ? d.trades[0].block : '');
      if (!force && key === lastKey) return;            // nothing new: keep the chart still
      lastKey = key;
      drawChart(chartStage, d.candles, range);
      if (d.candles.length >= 2) { const a = d.candles[0].open || d.candles[0].close, b = d.candles[d.candles.length - 1].close; const ch = a ? (b - a) / a * 100 : 0; changeEl.className = 'noxa-chart-change ' + (ch >= 0 ? 'is-up' : 'is-down'); changeEl.firstChild.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%'; priceRoll.textContent = fmtUsd(b); }
    };
    RANGES.forEach(([lbl]) => ranges.append(el('button', { class: 'noxa-chart-range' + (lbl === range ? ' is-active' : ''), onclick: (e) => { range = lbl; [...ranges.children].forEach(b => b.classList.toggle('is-active', b === e.target)); changeEl.lastChild.textContent = lbl; paintChart(true).catch(() => {}); } }, lbl)));
    paintChart(true).catch(() => {}); timer = setInterval(() => paintChart().catch(() => {}), 3000);
    const onResize = () => paintChart(true).catch(() => {}); addEventListener('resize', onResize);
    cleanup = () => { clearInterval(timer); clearInterval(startedTimer); removeEventListener('resize', onResize); off('history', hHist); off('chat', hChat); off('viewers', hViewers); off('live', hLive); off('banned', hBan); off('unbanned', hUnban); off('room', hRoom); off('notice', hNotice); wsRoom = null; stopPlay(); stopHls(); stopLk(); document.removeEventListener('publish-changed', onPub); };
  }

  // ---- go live: browser (WHIP) or OBS (RTMPS key) ----
  let pc = null, localStream = null;
  async function stopPublish() { if (pc) { pc.close(); pc = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } if (pubRoom) { const r = pubRoom; pubRoom = null; pubCoin = null; await r.disconnect().catch(() => {}); document.dispatchEvent(new CustomEvent('publish-changed')); } }
  let pubRoom = null, pubCoin = null;
  async function lkPublish(c, opts) {
    await stopPublish();
    const { url, token } = await api('/api/lk/publisher', { method: 'POST', body: { token: c.address } });
    const LK = window.LivekitClient; const room = pubRoom = new LK.Room(); pubCoin = c.address;
    if (opts.stream) opts.stream.getTracks().forEach(t => t.stop());        // the preview stream: LiveKit opens its own
    await room.connect(url, token);
    await room.localParticipant.setCameraEnabled(true, opts.cam ? { deviceId: opts.cam } : undefined);
    await room.localParticipant.setMicrophoneEnabled(true, opts.mic ? { deviceId: opts.mic } : undefined);
    document.dispatchEvent(new CustomEvent('publish-changed'));
  }
  async function publish(whipUrl, stream, previewEl) {
    await stopPublish();
    localStream = stream; previewEl.srcObject = stream;
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
    stream.getTracks().forEach(t => pc.addTransceiver(t, { direction: 'sendonly' }));
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    await new Promise(res => { if (pc.iceGatheringState === 'complete') return res(); const t = setTimeout(res, 2500); pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } }; });
    const r = await fetch(whipUrl, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (!r.ok) throw new Error('WHIP ' + r.status);
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
    stream.getVideoTracks()[0]?.addEventListener('ended', stopPublish);
  }
  let goingLive = false;
  const enumerate = async () => { try { const d = await navigator.mediaDevices.enumerateDevices(); return { cams: d.filter(x => x.kind === 'videoinput'), mics: d.filter(x => x.kind === 'audioinput') }; } catch { return { cams: [], mics: [] }; } };
  const devSelect = (list, cur, onchange, empty) => { const s = el('select', { class: 'dev-select', onchange: (e) => onchange(e.target.value) }); if (!list.length) s.append(el('option', { value: '' }, empty)); list.forEach((d, i) => s.append(el('option', { value: d.deviceId, selected: d.deviceId === cur ? '' : null }, d.label || (empty + ' ' + (i + 1))))); return s; };
  async function goLive(c) {
    if (goingLive) return;
    if (c.live && c.provider === 'livekit' && !pubRoom) { try { const creds = await api('/api/stream/creds?token=' + c.address); if (!creds.stream_key) return toast('You are streaming from a browser tab — use the controls on the player'); return credsModal(c, creds); } catch (e) { return toast(e.message); } }
    let mode = 'webcam', cam = '', mic = '', previewStream = null;
    const preview = el('video', { class: 'preview', playsinline: '' }); preview.muted = true; preview.autoplay = true;
    const title = el('input', { class: 'field', placeholder: 'Enter a descriptive title…', maxlength: 80, oninput: () => { next.disabled = !title.value.trim(); } });
    const next = el('button', { class: 'ui-btn ui-btn-primary', disabled: '' }, el('span', { class: 'ui-btn-label' }, 'Next'));
    const stopPreview = () => { if (previewStream) { previewStream.getTracks().forEach(t => t.stop()); previewStream = null; } };
    const startPreview = async () => { stopPreview(); try { previewStream = await navigator.mediaDevices.getUserMedia({ video: cam ? { deviceId: { exact: cam } } : true, audio: mic ? { deviceId: { exact: mic } } : true }); preview.srcObject = previewStream; const { cams, mics } = await enumerate(); cam = cam || (previewStream.getVideoTracks()[0]?.getSettings().deviceId || ''); mic = mic || (previewStream.getAudioTracks()[0]?.getSettings().deviceId || ''); inputs.innerHTML = ''; inputs.append(el('div', { class: 'dev-row' }, svgIcon(ICON.cam), devSelect(cams, cam, (v) => { cam = v; startPreview(); }, 'Camera')), el('div', { class: 'dev-row' }, svgIcon(ICON.mic), devSelect(mics, mic, (v) => { mic = v; startPreview(); }, 'Microphone'))); } catch (e) { inputs.innerHTML = ''; inputs.append(el('p', { class: 'hint' }, 'Camera or microphone not available: ' + (e.message || e))); } };
    const inputs = el('div', { class: 'dev-inputs' });
    const modeSel = el('select', { class: 'dev-select is-mode', onchange: (e) => { mode = e.target.value; paint(); } }, el('option', { value: 'webcam' }, 'Webcam'), el('option', { value: 'rtmp' }, 'RTMP (OBS/streaming software)'));
    const webcamBlock = el('div', {}, preview, el('div', { class: 'field-label' }, 'Video/audio inputs'), inputs);
    const body = el('div');
    const paint = () => { body.innerHTML = ''; if (mode === 'webcam') { body.append(webcamBlock); if (!previewStream) startPreview(); } else stopPreview(); };
    paint();
    const box = el('div', { class: 'golive' },
      el('div', { class: 'golive-head' }, el('h3', {}, 'Stream preview'), el('button', { class: 'golive-close', onclick: () => { stopPreview(); closeModal(); } }, '✕')),
      el('div', { class: 'field-label' }, 'Broadcast mode'), modeSel, el('p', { class: 'hint', style: 'margin:6px 0 14px' }, 'Choose a broadcast type for your stream'),
      body,
      el('div', { class: 'field-label' }, 'Stream title (required)'), title,
      el('label', { class: 'toggle-row' }, el('input', { type: 'checkbox', id: 'ho-toggle' }), el('span', { class: 'toggle-ui' }), el('span', {}, 'Holders-only chat', el('small', {}, 'Only wallets holding $' + c.symbol + ' can write'))),
      next);
    next.onclick = async () => {
      const t = title.value.trim(); if (!t) return;
      goingLive = true; next.disabled = true; next.firstChild.textContent = 'Starting…';
      try {
        const creds = await api('/api/stream/start', { method: 'POST', body: { token: c.address, title: t, mode, holders_only: !!document.querySelector('#ho-toggle')?.checked } });
        if (mode === 'rtmp') { stopPreview(); credsModal(c, creds); }
        else { const s = previewStream; previewStream = null; closeModal(); await lkPublish(c, { stream: s, cam, mic }); toast('You are live'); }
      } catch (e) { toast(e.message || 'failed'); next.disabled = false; next.firstChild.textContent = 'Next'; }
      goingLive = false;
    };
    openModal(box);
  }
  function credsModal(c, creds) {
    const row = (icon, value, hidden) => el('div', { class: 'cred-row' }, svgIcon(icon), el('span', { class: 'cred-val' }, hidden ? value.slice(0, 4) + '•'.repeat(10) : value), el('button', { class: 'cred-copy', title: 'Copy', onclick: () => { navigator.clipboard?.writeText(value); toast('Copied'); } }, svgIcon(ICON.copy)));
    const box = el('div', { class: 'golive' },
      el('div', { class: 'golive-head' }, el('h3', {}, 'Stream credentials'), el('button', { class: 'golive-close', onclick: closeModal }, '✕')),
      el('p', { class: 'hint', style: 'margin:0 0 14px;font-size:14px' }, 'Add the URL and stream key below to your streaming software. Viewers see you within a couple of seconds.'),
      row(ICON.globe, creds.rtmps_url, false), row(ICON.key, creds.stream_key, true),
      el('button', { class: 'ui-btn cred-reset', onclick: async (e) => { if (!confirm('Reset credentials? The old key stops working.')) return; e.target.disabled = true; try { const n = await api('/api/stream/reset', { method: 'POST', body: { token: c.address } }); closeModal(); credsModal(c, n); toast('New credentials'); } catch (err) { toast(err.message); e.target.disabled = false; } } }, el('span', { class: 'ui-btn-label' }, 'Reset credentials')),
      c.live ? el('button', { class: 'ui-btn', style: 'margin-top:8px;background:var(--panel-blue)', onclick: async () => { await api('/api/stream/stop', { method: 'POST', body: { token: c.address } }).catch(() => {}); closeModal(); toast('Stream ended'); } }, el('span', { class: 'ui-btn-label' }, 'End stream')) : null);
    openModal(box);
  }

  render();
})();
</script>
