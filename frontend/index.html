<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pons.live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%23d4fc50%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27Inter,Arial,sans-serif%27 font-size=%2738%27 font-weight=%27500%27 text-anchor=%27middle%27 fill=%27%23111%27%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="/assets/lightweight-charts.js"></script>
<style>
  :root {
    --bg:#0d0d0d; --panel:#161616; --card:#1f1f1f; --ink:#0d0d0d;
    --text:#f2f2f2; --muted:rgba(242,242,242,.58); --dim:rgba(242,242,242,.4);
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.08); --fill:rgba(255,255,255,.06); --fill2:rgba(255,255,255,.1);
    --lime:#d4fc50; --lime-soft:rgba(212,252,80,.14); --lime-line:rgba(212,252,80,.32);
    --red:#ff6b6b; --up:#d4fc50; --down:#ff6b6b;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,sans-serif; font-size:14px; font-weight:400; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; }
  .mono { font-variant-numeric:tabular-nums; }
  .shell { max-width:1180px; margin:0 auto; padding:0 20px 60px; }

  /* top bar */
  .top { display:flex; align-items:center; gap:14px; padding:18px 0 10px; }
  .logo { display:flex; align-items:center; gap:9px; margin-right:6px; }
  .logo .mark { width:32px; height:32px; border-radius:9px; background:var(--lime); color:#111; display:flex; align-items:center; justify-content:center; font-weight:500; font-size:17px; }
  .logo .word { font-size:16px; letter-spacing:-.2px; }
  .logo .word b { font-weight:400; color:var(--lime); }
  .navpills { display:flex; gap:2px; background:var(--fill); border-radius:999px; padding:3px; }
  .navpills a { padding:8px 12px; border-radius:999px; color:var(--muted); font-size:14px; display:flex; align-items:center; gap:7px; }
  .navpills a.on { background:var(--fill2); color:var(--text); }
  .navpills .dot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); }
  .spacer { flex:1; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--lime); color:#111; border:0; border-radius:999px; padding:10px 16px; font-weight:500; font-size:15px; cursor:pointer; white-space:nowrap; }
  .btn.ghost { background:var(--fill); color:var(--text); border:1px solid var(--line2); }
  .btn.dark { background:var(--card); color:var(--text); border:1px solid var(--line); font-size:13px; }
  .btn.red { background:var(--fill); color:var(--red); border:1px solid var(--line2); }
  .btn.sm { padding:8px 11px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* search row */
  .tools { display:flex; gap:12px; margin:14px 0 22px; }
  .search { flex:1; display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:999px; padding:12px 16px; box-shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35); color:var(--muted); }
  .search input { flex:1; background:none; border:0; outline:0; color:var(--text); font:inherit; font-size:16px; }
  .search input::placeholder { color:var(--muted); }
  .search kbd { font:inherit; font-size:11px; color:var(--dim); border:1px solid var(--line2); border-radius:8px; padding:3px 6px; }

  /* sections */
  .sec { background:var(--panel); border:1px solid var(--line); border-radius:28px; padding:24px; margin-bottom:18px; }
  .sec.hot { background:radial-gradient(circle at 14% 0%, rgba(212,252,80,.18), transparent 52%), var(--panel); border-color:var(--lime-line); box-shadow:inset 0 1px 0 rgba(232,255,153,.18), 0 0 0 1px rgba(212,252,80,.08); }
  .sec h2 { margin:0; font-size:22px; font-weight:400; display:flex; align-items:center; gap:10px; }
  .chip { background:var(--lime-soft); color:var(--text); font-size:12px; border-radius:999px; padding:2px 8px; line-height:18px; }
  .sub { color:var(--muted); font-size:14px; margin:6px 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:14px; }
  .empty { color:var(--muted); padding:26px 0; text-align:center; grid-column:1/-1; }

  /* coin card */
  .card { background:var(--card); border-radius:20px; padding:10px; cursor:pointer; transition:transform .15s ease, background .15s; }
  .card:hover { transform:translateY(-2px); background:#242424; }
  .card.new { animation:pop .6s ease-out; }
  @keyframes pop { from { box-shadow:0 0 0 2px var(--lime); } }
  .media { position:relative; aspect-ratio:1/1; border-radius:14px; background:var(--ink); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .media img { width:100%; height:100%; object-fit:cover; display:block; }
  .media .ph { font-size:26px; color:var(--dim); }
  .badges { position:absolute; top:8px; left:8px; display:flex; gap:4px; }
  .badge { background:rgba(255,255,255,.14); color:#fff; font-size:10px; border-radius:999px; padding:4px 8px; backdrop-filter:blur(6px); }
  .badge.live { background:var(--lime); color:#111; display:flex; align-items:center; gap:5px; }
  .badge.live::before { content:""; width:6px; height:6px; border-radius:50%; background:#111; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .badge.views { position:absolute; top:8px; right:8px; }
  .cbody { padding:10px 2px 2px; }
  .cbody .n { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cbody .s { font-size:12px; color:var(--muted); margin-top:1px; }
  .cbody .mc { margin-top:10px; font-size:14px; }
  .cbody .mc small { font-size:11px; color:var(--muted); margin-left:4px; }
  .cbody .foot { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin-top:8px; }

  /* coin page */
  .back { display:inline-flex; align-items:center; gap:6px; background:var(--card); border-radius:999px; padding:7px 12px; font-size:12px; color:var(--muted); margin:6px 0 16px; }
  .coin { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:18px; align-items:start; }
  .head { display:flex; align-items:center; gap:14px; }
  .head .logoimg { width:56px; height:56px; border-radius:14px; background:var(--ink); object-fit:cover; flex:none; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .head .t { font-size:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .head .t small { font-size:14px; color:var(--muted); }
  .head .sub { margin:6px 0 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--card); border-radius:999px; padding:6px 10px; font-size:12px; color:var(--muted); cursor:pointer; border:0; }
  .pill b { font-weight:400; color:var(--text); }
  .pill.lime { background:var(--lime-soft); }
  .mcap { margin-left:auto; text-align:right; }
  .mcap b { display:block; font-weight:400; font-size:26px; }
  .mcap span { font-size:12px; color:var(--muted); }
  .player { position:relative; background:#000; border-radius:20px; overflow:hidden; aspect-ratio:16/9; }
  .player iframe, .player video { width:100%; height:100%; border:0; display:block; }
  .player .off { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); background:var(--ink); }
  .player .off img { width:96px; height:96px; border-radius:20px; object-fit:cover; }
  .player .lv { position:absolute; top:12px; left:12px; display:flex; gap:6px; z-index:2; }
  .player .lv .badge { position:static; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:16px; }
  .stats div { padding:12px 14px; border-left:1px solid var(--line2); }
  .stats div:first-child { border-left:0; padding-left:0; }
  .stats label { display:block; font-size:11px; color:var(--muted); margin-bottom:6px; }
  .stats span { font-size:14px; }
  .tfs { display:flex; gap:2px; margin-left:auto; }
  .tfs button { background:none; border:0; color:var(--muted); border-radius:999px; padding:6px 10px; cursor:pointer; font-size:11px; }
  .tfs button.on { background:rgba(255,255,255,.08); color:var(--text); }
  .sec h3 { margin:0; font-size:17px; font-weight:400; display:flex; align-items:center; gap:10px; }
  .sec .hd { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  #chart { height:300px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:400; font-size:12px; padding:8px 6px; border-bottom:1px solid var(--line2); }
  td { padding:9px 6px; border-bottom:1px solid var(--line2); }
  tr:last-child td { border-bottom:0; }
  .buy { color:var(--up); } .sell { color:var(--down); }
  .about p { margin:0 0 12px; white-space:pre-wrap; color:var(--muted); line-height:1.5; }
  .links { display:flex; gap:8px; flex-wrap:wrap; }

  /* chat */
  .chat { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); max-height:820px; }
  .chat .msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:2px 0; }
  .msg { font-size:13px; line-height:1.4; word-break:break-word; }
  .msg b { font-weight:400; color:var(--lime); cursor:pointer; }
  .msg.sys { color:var(--dim); }
  .chat form { display:flex; gap:8px; margin-top:12px; }
  .chat input { flex:1; background:var(--fill); border:1px solid var(--line2); border-radius:999px; padding:11px 14px; color:var(--text); font:inherit; outline:0; }
  .chat input::placeholder { color:var(--dim); }

  /* modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal .box { background:var(--panel); border:1px solid var(--line); border-radius:28px; padding:24px; width:min(560px,100%); max-height:92vh; overflow:auto; }
  .modal h3 { margin:0 0 16px; font-size:20px; font-weight:400; }
  .tabs { display:flex; gap:2px; background:var(--fill); border-radius:999px; padding:3px; margin-bottom:16px; }
  .tabs button { flex:1; background:none; border:0; color:var(--muted); padding:9px; border-radius:999px; cursor:pointer; font-size:14px; }
  .tabs button.on { background:var(--fill2); color:var(--text); }
  .field { width:100%; background:var(--fill); border:1px solid var(--line2); border-radius:16px; padding:12px 14px; color:var(--text); font:inherit; outline:0; margin-bottom:12px; }
  .key { display:flex; gap:10px; align-items:center; background:var(--fill); border:1px solid var(--line2); border-radius:16px; padding:10px 12px; margin-bottom:8px; font-size:12px; color:var(--muted); }
  .key code { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .hint { color:var(--muted); font-size:12px; margin:8px 0; line-height:1.5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .wallets button { display:flex; width:100%; justify-content:flex-start; margin-bottom:8px; }
  .preview { width:100%; aspect-ratio:16/9; background:#000; border-radius:16px; margin-bottom:10px; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:10px 16px; border-radius:999px; z-index:60; font-size:13px; }

  @media (max-width:980px) {
    .coin { grid-template-columns:1fr; }
    .chat { position:static; height:60vh; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .stats div:nth-child(3) { border-left:0; padding-left:0; }
    .navpills a span { display:none; }
    .top .btn { padding:9px 14px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <a class="logo" href="/" data-link><span class="mark">P</span><span class="word">pons<b>.live</b></span></a>
    <div class="navpills">
      <a href="/" data-link id="nav-home"><span>Explore</span></a>
      <a href="/live" data-link id="nav-live"><i class="dot"></i><span>Live</span></a>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="wallet">Connect</button>
  </div>
  <div class="tools">
    <label class="search">⌕ <input id="q" placeholder="Search tokens by name, ticker or address"><kbd>↵</kbd></label>
    <button class="btn dark" id="golive-top">● Go live</button>
  </div>
  <div id="page"></div>
</div>
<div id="modal"></div>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v); } for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k))); return e; };
  const fmtUsd = (v) => { v = Number(v || 0); return v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? '$' + (v / 1e3).toFixed(1) + 'K' : '$' + v.toFixed(v < 10 ? 2 : 0); };
  const fmtPrice = (v) => { v = Number(v || 0); if (!v) return '—'; return '$' + (v >= 1 ? v.toFixed(2) : v.toPrecision(3)); };
  const short = (a) => a ? a.slice(0, 6) + '…' + a.slice(-4) : '';
  const ago = (s) => { s = Math.max(0, Math.round(s)); return s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; };
  const toast = (m) => { const t = el('div', { class: 'toast' }, m); document.body.append(t); setTimeout(() => t.remove(), 2200); };
  const api = async (p, opt = {}) => { const h = { 'Content-Type': 'application/json', ...(session ? { Authorization: 'Bearer ' + session.token } : {}) }; const r = await fetch(p, { ...opt, headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; };

  // ---- wallet (EIP-6963 + window.ethereum) → nonce → personal_sign → session ----
  let session = null; try { session = JSON.parse(localStorage.getItem('pl_session') || 'null'); } catch {}
  const providers = [];
  addEventListener('eip6963:announceProvider', (e) => { if (!providers.some(p => p.info.uuid === e.detail.info.uuid)) providers.push(e.detail); });
  dispatchEvent(new Event('eip6963:requestProvider'));
  async function signIn(prov) {
    const eth = prov.provider;
    const [acc] = await eth.request({ method: 'eth_requestAccounts' });
    const address = acc.toLowerCase();
    const { message } = await api('/api/auth/nonce', { method: 'POST', body: { address } });
    const hex = '0x' + Array.from(new TextEncoder().encode(message), b => b.toString(16).padStart(2, '0')).join('');
    const signature = await eth.request({ method: 'personal_sign', params: [hex, address] });
    const r = await api('/api/auth/verify', { method: 'POST', body: { address, signature } });
    session = { token: r.token, address: r.address, wallet: prov.info.name };
    localStorage.setItem('pl_session', JSON.stringify(session));
    paintWallet(); wsSend({ t: 'auth', token: session.token }); render();
  }
  function walletModal() {
    const list = providers.length ? providers : (window.ethereum ? [{ info: { name: 'Browser wallet', uuid: 'legacy' }, provider: window.ethereum }] : []);
    openModal(el('div', {}, el('h3', {}, 'Connect wallet'),
      list.length ? el('div', { class: 'wallets' }, ...list.map(p => el('button', { class: 'btn ghost', onclick: async () => { try { closeModal(); await signIn(p); } catch (e) { toast(e.message || 'connect failed'); } } }, p.info.icon ? el('img', { src: p.info.icon, width: 22, height: 22, style: 'border-radius:6px' }) : null, p.info.name)))
        : el('p', { class: 'hint' }, 'No wallet extension found. Install MetaMask, Rabby or the Robinhood wallet.'),
      el('p', { class: 'hint' }, 'You sign a message to prove the wallet is yours. No transaction, no gas.')));
  }
  function paintWallet() { $('#wallet').textContent = session ? short(session.address) : 'Connect'; }
  $('#wallet').onclick = () => { if (session) { if (confirm('Sign out?')) { session = null; localStorage.removeItem('pl_session'); paintWallet(); render(); } } else walletModal(); };
  paintWallet();
  $('#golive-top').onclick = async () => {
    if (!session) return walletModal();
    const me = await api('/api/me').catch(() => ({ coins: [] }));
    if (!me.coins || !me.coins.length) return toast('no PONS coins launched from this wallet');
    if (me.coins.length === 1) return go('/coin/' + me.coins[0].address);
    openModal(el('div', {}, el('h3', {}, 'Your coins'), el('div', { class: 'wallets' }, ...me.coins.map(c => el('button', { class: 'btn ghost', onclick: () => { closeModal(); go('/coin/' + c.address); } }, c.image ? el('img', { src: c.image, width: 22, height: 22, style: 'border-radius:6px' }) : null, (c.name || short(c.address)) + (c.symbol ? '  $' + c.symbol : ''))))));
  };

  // ---- modal ----
  function openModal(node) { const m = $('#modal'); m.innerHTML = ''; m.append(el('div', { class: 'modal', onclick: (e) => { if (e.target.classList.contains('modal')) closeModal(); } }, el('div', { class: 'box' }, node))); }
  function closeModal() { $('#modal').innerHTML = ''; }

  // ---- websocket: launches, live flags, chat ----
  let ws, wsRoom = null; const handlers = { launch: [], live: [], chat: [], history: [], viewers: [], banned: [], auth: [] };
  function connectWs() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { if (session) ws.send(JSON.stringify({ t: 'auth', token: session.token })); if (wsRoom) ws.send(JSON.stringify({ t: 'sub', room: wsRoom })); };
    ws.onmessage = (e) => { const m = JSON.parse(e.data); (handlers[m.t] || []).forEach(f => f(m)); };
    ws.onclose = () => setTimeout(connectWs, 1500);
  }
  const on = (t, f) => handlers[t].push(f);
  const off = (t, f) => { handlers[t] = handlers[t].filter(x => x !== f); };
  const wsSend = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  connectWs();

  // ---- router ----
  document.addEventListener('click', (e) => { const a = e.target.closest('a[data-link]'); if (a) { e.preventDefault(); go(a.getAttribute('href')); } });
  function go(p) { history.pushState({}, '', p); render(); window.scrollTo(0, 0); }
  addEventListener('popstate', render);
  let cleanup = null;
  function render() {
    if (cleanup) { cleanup(); cleanup = null; }
    const p = location.pathname;
    $('#nav-live').classList.toggle('on', p === '/live');
    $('#nav-home').classList.toggle('on', p === '/' || p === '/search');
    if (p.startsWith('/coin/')) return coinPage(p.split('/')[2]);
    if (p === '/search') return searchPage(new URLSearchParams(location.search).get('q') || '');
    return homePage(p === '/live');
  }
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value.trim()) go('/search?q=' + encodeURIComponent(e.target.value.trim())); });

  // ---- cards ----
  function card(c) {
    const ph = () => el('div', { class: 'ph' }, (c.symbol || '?').slice(0, 5));
    const img = c.image ? el('img', { src: c.image, loading: 'lazy', onerror: (e) => e.target.replaceWith(ph()) }) : ph();
    return el('div', { class: 'card', onclick: () => go('/coin/' + c.address) },
      el('div', { class: 'media' }, img,
        el('div', { class: 'badges' }, c.live ? el('span', { class: 'badge live' }, 'LIVE') : null, c.graduated ? el('span', { class: 'badge' }, 'Graduated') : null, c.quote_symbol && !['ETH', 'USDG'].includes(c.quote_symbol) ? el('span', { class: 'badge' }, c.quote_symbol) : null),
        c.live ? el('span', { class: 'badge views' }, `${c.viewers} watching`) : null),
      el('div', { class: 'cbody' },
        el('div', { class: 'n' }, c.name || short(c.address)),
        el('div', { class: 's' }, c.symbol ? '$' + c.symbol : ' '),
        el('div', { class: 'mc mono' }, fmtUsd(c.mcap_usd), el('small', {}, 'MC')),
        el('div', { class: 'foot' }, el('span', {}, short(c.deployer)), el('span', {}, c.age != null ? ago(c.age) : ''))));
  }
  async function homePage(liveOnly) {
    const page = $('#page'); page.innerHTML = '';
    const liveGrid = el('div', { class: 'grid' });
    const liveCount = el('span', { class: 'chip' }, '0');
    page.append(el('section', { class: 'sec hot' }, el('h2', {}, 'Live now', liveCount), el('div', { class: 'sub' }, 'Creators streaming on their coins right now.'), liveGrid));
    let recGrid, recCount;
    if (!liveOnly) { recGrid = el('div', { class: 'grid' }); recCount = el('span', { class: 'chip' }, ''); page.append(el('section', { class: 'sec' }, el('h2', {}, 'New launches', recCount), el('div', { class: 'sub' }, 'Every token launched on PONS, the moment it hits the chain.'), recGrid)); }

  // ---- go live: browser (WHIP) or OBS (RTMPS key) ----
  let pc = null, localStream = null;
  async function stopPublish() { if (pc) { pc.close(); pc = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } }
  async function publish(whipUrl, stream, previewEl) {
    await stopPublish();
    localStream = stream; previewEl.srcObject = stream;
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
    stream.getTracks().forEach(t => pc.addTransceiver(t, { direction: 'sendonly' }));
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    await new Promise(res => { if (pc.iceGatheringState === 'complete') return res(); const t = setTimeout(res, 2500); pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } }; });
    const r = await fetch(whipUrl, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (!r.ok) throw new Error('WHIP ' + r.status);
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
    stream.getVideoTracks()[0]?.addEventListener('ended', stopPublish);
  }
  async function goLive(c) {

        el('button', { class: 'btn', onclick: async () => { try { await publish(creds.whip_url, await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true }), preview); status.textContent = 'Publishing camera'; } catch (e) { toast(e.message); } } }, 'Camera'),
        el('button', { class: 'btn', onclick: async () => { try { const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }); await publish(creds.whip_url, s, preview); status.textContent = 'Publishing screen'; } catch (e) { toast(e.message); } } }, 'Screen'),
        el('button', { class: 'btn ghost', onclick: async () => { await stopPublish(); status.textContent = 'Not publishing'; } }, 'Stop')),
        el('p', { class: 'hint' }, 'Viewers see you within ~10 seconds. Keep this tab open while live.'));
      else body.append(el('p', { class: 'hint' }, 'OBS → Settings → Stream → Service: Custom'),
        el('div', { class: 'key' }, 'Server', el('code', {}, creds.rtmps_url), el('button', { class: 'btn ghost sm', onclick: () => { navigator.clipboard?.writeText(creds.rtmps_url); toast('Copied'); } }, 'Copy')),
        el('div', { class: 'key' }, 'Stream key', el('code', {}, '•'.repeat(24)), el('button', { class: 'btn ghost sm', onclick: () => { navigator.clipboard?.writeText(creds.stream_key); toast('Key copied'); } }, 'Copy')),
        el('p', { class: 'hint' }, 'Start streaming in OBS; the page flips to LIVE automatically. The key is permanent — never share it.'));
    };
    paint();
    openModal(el('div', {}, el('h3', {}, 'Go live · $' + c.symbol), title,
      el('div', { class: 'tabs' }, el('button', { class: 'on', onclick: (e) => { tab = 'browser'; [...e.target.parentNode.children].forEach(b => b.classList.toggle('on', b === e.target)); paint(); } }, 'From this browser'), el('button', { onclick: (e) => { tab = 'obs'; [...e.target.parentNode.children].forEach(b => b.classList.toggle('on', b === e.target)); paint(); } }, 'OBS / stream key')),
      body,
      el('div', { class: 'row', style: 'margin-top:16px;justify-content:space-between' },
        el('button', { class: 'btn ghost', onclick: async () => { const t = title.value.trim(); await api('/api/stream/start', { method: 'POST', body: { token: c.address, title: t } }).catch(() => {}); toast('Saved'); } }, 'Save title'),
        el('button', { class: 'btn red', onclick: async () => { await stopPublish(); await api('/api/stream/stop', { method: 'POST', body: { token: c.address } }).catch(() => {}); closeModal(); toast('Stream ended'); } }, 'End stream'))));
  }
